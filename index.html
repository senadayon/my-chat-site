<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Chat App</title>
    <style>
        :root {
            --primary: #4a90e2;
            --bg: #f5f7fb;
            --chat-bg: #ffffff;
            --text: #333333;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 400px;
            height: 600px;
            background: var(--chat-bg);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* ボイスチャット拡張ヘッダー */
        .voice-extension-bar {
            background: #2c3e50;
            color: white;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            border-bottom: 2px solid #34495e;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background: #bdc3c7;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }
        .status-dot.active {
            background: #2ecc71;
            box-shadow: 0 0 8px #2ecc71;
        }
        .voice-btn {
            background: var(--primary);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .voice-btn.connecting { background: #e67e22; }
        .voice-btn.active { background: #e74c3c; }

        /* チャットエリア */
        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 15px;
            line-height: 1.4;
            word-break: break-all;
        }
        .message.sent {
            background: var(--primary);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .message.received {
            background: #e9ecef;
            color: var(--text);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        /* 入力エリア */
        .chat-input-area {
            padding: 16px;
            background: #f8f9fa;
            border-top: 1px solid #eee;
            display: flex;
            gap: 8px;
        }
        .chat-input {
            flex: 1;
            border: 1px solid #ddd;
            padding: 10px 14px;
            border-radius: 24px;
            outline: none;
            font-size: 14px;
        }
        .send-btn {
            background: var(--primary);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- ボイスチャット機能（拡張モジュール） -->
    <div class="voice-extension-bar">
        <div>
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">ボイス非接続</span>
        </div>
        <button class="voice-btn" id="voiceBtn">通話開始</button>
    </div>

    <!-- チャットメッセージ画面 -->
    <div class="chat-messages" id="chatMessages">
        <div class="message received">こんにちは！下のボタンからテキストを送れます。上のバーでボイスチャットを起動できます。</div>
    </div>

    <!-- テキスト入力欄 -->
    <div class="chat-input-area">
        <input type="text" class="chat-input" id="chatInput" placeholder="メッセージを入力..." autocomplete="off">
        <button class="send-btn" id="sendBtn">➔</button>
    </div>
</div>

<!-- 音声出力用の隠しオーディオ要素 -->
<audio id="remoteAudio" autoplay></audio>

<script>
    // テキストチャットの処理
    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');

    function sendMessage() {
        const text = chatInput.value.trim();
        if (!text) return;

        // 送信メッセージの表示
        const msgElement = document.createElement('div');
        msgElement.className = 'message sent';
        msgElement.textContent = text;
        chatMessages.appendChild(msgElement);
        chatInput.value = '';
        chatMessages.scrollTop = chatMessages.scrollHeight;

        // エコー返信（モック動作）
        setTimeout(() => {
            const replyElement = document.createElement('div');
            replyElement.className = 'message received';
            replyElement.textContent = `「${text}」を受信しました。`;
            chatMessages.appendChild(replyElement);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }, 1000);
    }

    sendBtn.addEventListener('click', sendMessage);
    chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

    // ボイスチャット拡張機能の処理 (WebRTCによるマイク接続)
    const voiceBtn = document.getElementById('voiceBtn');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const remoteAudio = document.getElementById('remoteAudio');
    
    let localStream = null;
    let isCalling = false;

    voiceBtn.addEventListener('click', async () => {
        if (!isCalling) {
            try {
                // 1. ユーザーのマイクへのアクセス権限をリクエスト
                statusText.textContent = '接続中...';
                voiceBtn.className = 'voice-btn connecting';
                
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                
                // 2. 接続成功時の画面UIの更新
                statusDot.className = 'status-dot active';
                statusText.textContent = '通話中 (マイクON)';
                voiceBtn.textContent = '切断';
                voiceBtn.className = 'voice-btn active';
                isCalling = true;

                // 本格的な1対1・複数人通話を行う場合は、ここにSkyWayやFirebaseなどのシグナリング処理を組み込み、
                // 相手のストリームを remoteAudio.srcObject = remoteStream に代入します。
                
            } catch (err) {
                console.error('マイクのアクセスに失敗しました:', err);
                alert('マイクの許可が必要です。');
                resetVoiceUI();
            }
        } else {
            // 通話切断処理
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            resetVoiceUI();
        }
    });

    function resetVoiceUI() {
        statusDot.className = 'status-dot';
        statusText.textContent = 'ボイス非接続';
        voiceBtn.textContent = '通話開始';
        voiceBtn.className = 'voice-btn';
        isCalling = false;
    }
</script>

</body>
</html>
