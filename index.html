<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realtime Online Chat & Voice</title>
    <!-- SkyWay SDK の読み込み -->
    <script src="https://jsdelivr.net"></script>
    <style>
        :root {
            --primary: #4a90e2;
            --bg: #f5f7fb;
            --chat-bg: #ffffff;
            --text: #333333;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 400px;
            height: 600px;
            background: var(--chat-bg);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* オンライン接続バー */
        .voice-extension-bar {
            background: #2c3e50;
            color: white;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background: #bdc3c7;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }
        .status-dot.active {
            background: #2ecc71;
            box-shadow: 0 0 8px #2ecc71;
        }
        .voice-btn {
            background: var(--primary);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        .voice-btn.active { background: #e74c3c; }

        /* チャットエリア */
        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 15px;
            line-height: 1.4;
            word-break: break-all;
        }
        .message.sent {
            background: var(--primary);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .message.received {
            background: #e9ecef;
            color: var(--text);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        /* 入力エリア */
        .chat-input-area {
            padding: 16px;
            background: #f8f9fa;
            border-top: 1px solid #eee;
            display: flex;
            gap: 8px;
        }
        .chat-input {
            flex: 1;
            border: 1px solid #ddd;
            padding: 10px 14px;
            border-radius: 24px;
            outline: none;
            font-size: 14px;
        }
        .chat-input:disabled {
            background: #e9ecef;
            placeholder: "接続を待っています...";
        }
        .send-btn {
            background: var(--primary);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- ボイスチャット・オンライン接続管理 -->
    <div class="voice-extension-bar">
        <div>
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">オフライン</span>
        </div>
        <button class="voice-btn" id="voiceBtn">オンラインになる</button>
    </div>

    <!-- チャットメッセージ画面 -->
    <div class="chat-messages" id="chatMessages">
        <div class="message received" id="systemMsg">上のボタンを押してオンラインに接続すると、チャットの送受信や音声通話ができるようになります！</div>
    </div>

    <!-- テキスト入力欄 -->
    <div class="chat-input-area">
        <input type="text" class="chat-input" id="chatInput" placeholder="まずオンラインに接続してください" autocomplete="off" disabled>
        <button class="send-btn" id="sendBtn" disabled>➔</button>
    </div>
</div>

<div id="remoteAudioContainer"></div>

<script>
    // ⚠️ SkyWayの一時的なテストトークン
    const SKYWAY_TOKEN = 'YOUR_SKYWAY_TOKEN_OR_GENERIC_TEST_TOKEN'; 

    const { SkyWayContext, SkyWayRoom } = SkyWayRoomPackage;
    
    // UI要素の取得
    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const voiceBtn = document.getElementById('voiceBtn');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const audioContainer = document.getElementById('remoteAudioContainer');

    let context, room, me, localAudioTrack, localDataTrack;
    let isOnline = false;

    // 1. メッセージを画面に描画する共通関数
    function appendMessage(text, type) {
        const msgElement = document.createElement('div');
        msgElement.className = `message ${type}`;
        msgElement.textContent = text;
        chatMessages.appendChild(msgElement);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // 2. テキストチャットを送信する処理
    async function sendMessage() {
        const text = chatInput.value.trim();
        if (!text || !isOnline || !localDataTrack) return;

        // 自分の画面に表示
        appendMessage(text, 'sent');
        chatInput.value = '';

        // 🚀 オンライン上の他のユーザーにテキストデータを送信
        localDataTrack.write(text);
    }

    sendBtn.addEventListener('click', sendMessage);
    chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

    // 3. オンライン接続 & ボイスチャット開始処理
    voiceBtn.addEventListener('click', async () => {
        if (!isOnline) {
            try {
                statusText.textContent = '接続中...';
                
                // マイク音声の取得
                const mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                localAudioTrack = new SkyWayRoomPackage.WebRtcAudioTrack(mediaStream.getAudioTracks());
                
                // 🚀 テキスト受信用データトラックの作成
                localDataTrack = new SkyWayRoomPackage.LocalDataTrack();

                // SkyWayサーバー接続設定
                context = await SkyWayContext.Create(SKYWAY_TOKEN);
                room = await SkyWayRoom.FindOrCreate(context, {
                    type: 'p2p',
                    name: 'main-online-room'
                });

                // ルームへの参加
                me = await room.join();
                
                // 音声とテキストデータの両方を全体に公開（Publish）
                await me.publish(localAudioTrack);
                await me.publish(localDataTrack);

                // UIの有効化
                statusDot.className = 'status-dot active';
                statusText.textContent = 'オンライン（通話中）';
                voiceBtn.textContent = 'ログアウト';
                voiceBtn.className = 'voice-btn active';
                chatInput.disabled = false;
                chatInput.placeholder = "メッセージを入力...";
                sendBtn.disabled = false;
                document.getElementById('systemMsg').textContent = "オンラインに接続しました！同じ部屋の人と会話できます。";
                isOnline = true;

                // 4. 他の参加者のデータ（音声・テキスト）を受信する設定
                const subscribeAndHandle = async (publication) => {
                    if (publication.publisher.id === me.id) return;

                    const { stream } = await me.subscribe(publication.id);
                    
                    // 🎤 音声トラックを受信した場合
                    if (publication.contentType === 'audio') {
                        const remoteAudio = document.createElement('audio');
                        remoteAudio.srcObject = new MediaStream([stream.track]);
                        remoteAudio.autoplay = true;
                        audioContainer.appendChild(remoteAudio);
                    } 
                    // 💬 テキストデータトラックを受信した場合
                    else if (publication.contentType === 'data') {
                        stream.onData.add((text) => {
                            appendMessage(text, 'received'); // 相手からのメッセージを画面に表示
                        });
                    }
                };

                // 既存の接続者と、これ以降入ってきた接続者の両方を監視
                room.publications.forEach(subscribeAndHandle);
                room.onStreamPublished.add((e) => subscribeAndHandle(e.publication));

            } catch (err) {
                console.error(err);
                alert('オンライン接続に失敗しました。マイクの許可などを確認してください。');
                resetUI();
            }
        } else {
            // 切断処理
            if (localAudioTrack) localAudioTrack.release();
            if (localDataTrack) localDataTrack.close();
            if (room) await room.leave();
            resetUI();
        }
    });

    function resetUI() {
        statusDot.className = 'status-dot';
        statusText.textContent = 'オフライン';
        voiceBtn.textContent = 'オンラインになる';
        voiceBtn.className = 'voice-btn';
        chatInput.disabled = true;
        chatInput.placeholder = "まずオンラインに接続してください";
        sendBtn.disabled = true;
        audioContainer.innerHTML = '';
        isOnline = false;
    }
</script>

</body>
</html>
