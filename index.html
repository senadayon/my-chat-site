<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2Pボイチェン通話</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; text-align: center; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button { font-size: 14px; padding: 8px 15px; margin: 5px; cursor: pointer; border: none; border-radius: 5px; background: #007bff; color: white; }
        button:disabled { background: #ccc; }
        select, textarea { width: 90%; font-size: 14px; padding: 8px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; }
        textarea { height: 80px; font-family: monospace; font-size: 10px; }
        .step { background: #f9f9f9; padding: 10px; margin: 15px 0; border-left: 5px solid #007bff; text-align: left; }
        .status { font-weight: bold; color: #28a745; margin: 10px 0; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎙️ ネット越し2人通話 (ボイチェン付)</h2>
    <div id="status" class="status">1. まずマイクを起動してください</div>
    <button id="startMediaBtn">1. マイクを起動する</button>

    <div class="step">
        <label for="voiceEffect">自分の声のエフェクト：</label>
        <select id="voiceEffect" disabled>
            <option value="normal">ノーマル（そのまま）</option>
            <option value="high">高い声（ヘリウム風）</option>
            <option value="low">低い声（ダースベイダー風）</option>
            <option value="robot">ロボットボイス</option>
        </select>
    </div>

    <hr>

    <!-- 通信相手との接続エリア -->
    <div class="step">
        <h3>Aさん（発信側）の手順</h3>
        <button id="createOfferBtn" disabled>接続コードを発行</button>
        <p>生成されたコードをコピーしてBさんに送る：</p>
        <textarea id="localSdp" readonly placeholder="ここにコードが出ます"></textarea>
    </div>

    <div class="step">
        <h3>Bさん（受信側）の手順</h3>
        <p>Aさんから届いたコードを貼り付ける：</p>
        <textarea id="remoteSdp" placeholder="Aさんのコードをここに貼り付けてください"></textarea>
        <button id="answerBtn" disabled>接続を完了する</button>
    </div>

    <!-- 相手の音声出力用（画面には見えません） -->
    <audio id="remoteAudio" autoplay></audio>
</div>

<script>
    let localStream;
    let peerConnection;
    let audioCtx, microphone, biquadFilter, delayNode, feedbackNode, mediaStreamDestination;

    // STUNサーバー（お互いのネット上の住所を調べるための無料公開サーバー）
    const config = { iceServers: [{ urls: 'stun:://google.com' }] };

    const startMediaBtn = document.getElementById('startMediaBtn');
    const voiceEffect = document.getElementById('voiceEffect');
    const createOfferBtn = document.getElementById('createOfferBtn');
    const answerBtn = document.getElementById('answerBtn');
    const localSdpText = document.getElementById('localSdp');
    const remoteSdpText = document.getElementById('remoteSdp');
    const statusText = document.getElementById('status');
    const remoteAudio = document.getElementById('remoteAudio');

    // 1. マイク起動とボイチェンの初期化
    startMediaBtn.addEventListener('click', async () => {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            
            // Web Audio APIで加工環境を作る
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            microphone = audioCtx.createMediaStreamSource(localStream);
            biquadFilter = audioCtx.createBiquadFilter();
            delayNode = audioCtx.createDelay();
            feedbackNode = audioCtx.createGain();
            delayNode.delayTime.value = 0.015;
            feedbackNode.gain.value = 0.5;

            // 加工した音を「通信用ストリーム」に出力する
            mediaStreamDestination = audioCtx.createMediaStreamDestination();
            
            updateEffect();

            statusText.innerText = "✅ マイク準備完了！接続へ進んでください";
            voiceEffect.disabled = false;
            createOfferBtn.disabled = false;
            answerBtn.disabled = false;
            startMediaBtn.disabled = true;
        } catch (err) {
            alert("マイクの起動に失敗しました。");
        }
    });

    // ボイチェンの切り替え処理
    function updateEffect() {
        if (!audioCtx) return;
        microphone.disconnect();
        biquadFilter.disconnect();
        delayNode.disconnect();
        feedbackNode.disconnect();

        const effect = voiceEffect.value;
        if (effect === 'high') {
            biquadFilter.type = 'highpass';
            biquadFilter.frequency.setValueAtTime(1500, audioCtx.currentTime);
            microphone.connect(biquadFilter);
            biquadFilter.connect(mediaStreamDestination);
        } else if (effect === 'low') {
            biquadFilter.type = 'lowpass';
            biquadFilter.frequency.setValueAtTime(400, audioCtx.currentTime);
            microphone.connect(biquadFilter);
            biquadFilter.connect(mediaStreamDestination);
        } else if (effect === 'robot') {
            microphone.connect(delayNode);
            delayNode.connect(feedbackNode);
            feedbackNode.connect(delayNode);
            delayNode.connect(mediaStreamDestination);
        } else {
            microphone.connect(mediaStreamDestination);
        }
    }
    voiceEffect.addEventListener('change', updateEffect);

    // WebRTCコネクションの作成
    function createPeerConnection() {
        peerConnection = new RTCPeerConnection(config);

        // 加工済みの音声を通信に乗せる
        mediaStreamDestination.stream.getAudioTracks().forEach(track => {
            peerConnection.addTrack(track, mediaStreamDestination.stream);
        });

        // 相手の音声が届いた時の処理
        peerConnection.ontrack = event => {
            remoteAudio.srcObject = event.streams[0];
            statusText.innerText = "🎉 通話が繋がりました！";
        };

        // アドレス（ICE）が確定した時にコードを最終更新する
        peerConnection.onicecandidate = event => {
            if (!event.candidate) {
                localSdpText.value = JSON.stringify(peerConnection.localDescription);
                statusText.innerText = "📋 接続コードが完成しました！コピーして相手に送ってください";
            }
        };
    }

    // Aさん（発信側）の処理
    createOfferBtn.addEventListener('click', async () => {
        createPeerConnection();
        statusText.innerText = "⏳ 接続コードを生成中...";
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
    });

    // Bさん（受信側）の接続処理
    answerBtn.addEventListener('click', async () => {
        const inputSdp = remoteSdpText.value.trim();
        if (!inputSdp) return alert("相手のコードを貼り付けてください");

        const sessionDesc = JSON.parse(inputSdp);

        if (!peerConnection) {
            // まだ接続を作っていない場合（Bさんとしての処理）
            createPeerConnection();
            await peerConnection.setRemoteDescription(sessionDesc);
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
        } else {
            // Aさんが、Bさんから戻ってきたコードを貼り付けた場合の処理
            await peerConnection.setRemoteDescription(sessionDesc);
        }
    });
</script>

</body>
</html>
