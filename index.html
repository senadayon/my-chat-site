<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Clone Dashboard</title>
    <!-- Tailwind CSSの読み込み -->
    <script src="https://tailwindcss.com"></script>
    <!-- Socket.ioの読み込み -->
    <script src="https://socket.io"></script>
</head>
<body class="flex h-screen bg-[#313338] text-[#dbdee1] font-sans overflow-hidden">

    <!-- 左側：チャンネルリスト（ダミー） -->
    <div class="w-60 bg-[#2b2d31] flex flex-col justify-between hidden md:flex border-r border-[#202225]/20">
        <div>
            <div class="h-12 border-b border-[#1f2023] flex items-center px-4 font-bold text-white shadow-sm">
                GitHub Community
            </div>
            <div class="p-2 space-y-1">
                <div class="text-xs font-bold text-[#949ba4] px-2 pt-4 pb-1 uppercase tracking-wider">テキストチャンネル</div>
                <div class="flex items-center px-2 py-1.5 rounded bg-[#404249] text-white cursor-pointer text-sm font-medium">
                    <span class="text-[#949ba4] text-lg mr-1.5">#</span> general
                </div>
            </div>
        </div>
        <div class="bg-[#232428] p-2 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div id="user-avatar" class="w-8 h-8 rounded-full bg-[#5865f2] flex items-center justify-center font-bold text-white text-sm">U</div>
                <div id="user-name" class="text-sm font-semibold truncate max-w-[120px] text-white">Loading...</div>
            </div>
        </div>
    </div>

    <!-- 右側：チャットエリア -->
    <div class="flex-1 flex flex-col h-full bg-[#313338]">
        <div class="h-12 border-b border-[#1f2023] flex items-center px-4 shadow-sm shrink-0">
            <span class="text-[#80848e] text-2xl font-light mr-2">#</span>
            <span class="font-bold text-white text-base">general</span>
        </div>

        <!-- メッセージ表示エリア -->
        <div id="message-container" class="flex-1 overflow-y-auto p-4 space-y-4 min-h-0"></div>

        <!-- 入力フォーム -->
        <form id="chat-form" class="p-4 pt-0 shrink-0">
            <div class="bg-[#383a40] rounded-lg px-4 py-2.5 flex items-center">
                <input type="text" id="chat-input" placeholder="# general へのメッセージ" autocomplete="off"
                    class="bg-transparent w-full focus:outline-none text-[#dbdee1] placeholder-[#80848e] text-sm" />
            </div>
        </form>
    </div>

    <script>
        // 公開されている無料のテスト用Socket.ioサーバー、またはご自身のサーバーURLを指定
        const socket = io('https://glitch.me'); 
        
        const username = 'User_' + Math.floor(Math.random() * 1000);
        document.getElementById('user-name').innerText = username;
        document.getElementById('user-avatar').innerText = username[0];

        const container = document.getElementById('message-container');
        const form = document.getElementById('chat-form');
        const input = document.getElementById('chat-input');

        // メッセージ表示関数
        function appendMessage(data) {
            const time = data.time || new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const msgHtml = `
                <div class="flex items-start space-x-4 hover:bg-[#2e3035]/50 px-4 py-1 rounded transition-colors">
                    <div class="w-10 h-10 rounded-full bg-[#4e5058] text-white flex items-center justify-center font-bold shrink-0 mt-0.5">${data.user[0]}</div>
                    <div class="flex flex-col min-w-0">
                        <div class="flex items-baseline space-x-2">
                            <span class="font-semibold text-white text-sm">${data.user}</span>
                            <span class="text-xs text-[#949ba4]">${time}</span>
                        </div>
                        <p class="text-[#dbdee1] text-sm break-words whitespace-pre-wrap mt-0.5">${data.text}</p>
                    </div>
                </div>`;
            container.insertAdjacentHTML('beforeend', msgHtml);
            container.scrollTop = container.scrollHeight;
        }

        socket.on('load_messages', (messages) => {
            container.innerHTML = '';
            messages.forEach(appendMessage);
        });

        socket.on('receive_message', appendMessage);

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (!input.value.trim()) return;
            
            socket.emit('send_message', { user: username, text: input.value });
            input.value = '';
        });
    </script>
</body>
</html>
