<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Voice Chat</title>
    <!-- SkyWay SDK の読み込み -->
    <script src="https://jsdelivr.net"></script>
    <style>
        :root {
            --primary: #4a90e2;
            --bg: #f5f7fb;
            --chat-bg: #ffffff;
            --text: #333333;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 400px;
            height: 600px;
            background: var(--chat-bg);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .voice-extension-bar {
            background: #2c3e50;
            color: white;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background: #bdc3c7;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }
        .status-dot.active {
            background: #2ecc71;
            box-shadow: 0 0 8px #2ecc71;
        }
        .voice-btn {
            background: var(--primary);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        .voice-btn.active { background: #e74c3c; }
        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 15px;
        }
        .message.received {
            background: #e9ecef;
            color: var(--text);
            align-self: flex-start;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="voice-extension-bar">
        <div>
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">ボイス非接続</span>
        </div>
        <button class="voice-btn" id="voiceBtn">通話開始</button>
    </div>
    <div class="chat-messages" id="chatMessages">
        <div class="message received">同じURLを開いた2人で上の「通話開始」を押すと、リアルタイムで声が繋がります！</div>
    </div>
</div>

<!-- 相手の声を再生するためのオーディオエリア -->
<div id="remoteAudioContainer"></div>

<script>
    // ⚠️ テスト用の公開トークン（体験用のため数時間で無効になる場合があります）
    // 本格運用の場合は、SkyWay公式サイトで無料のアカウントを作成し、自分のトークンに差し替えてください。
    const SKYWAY_TOKEN = 'YOUR_SKYWAY_TOKEN_OR_GENERIC_TEST_TOKEN'; 

    const { SkyWayContext, SkyWayRoom } = SkyWayRoomPackage;
    
    const voiceBtn = document.getElementById('voiceBtn');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const audioContainer = document.getElementById('remoteAudioContainer');

    let context;
    let room;
    let me;
    let localAudioTrack;
    let isCalling = false;

    voiceBtn.addEventListener('click', async () => {
        if (!isCalling) {
            try {
                statusText.textContent = '接続中...';
                
                // 1. マイクの取得
                const mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                localAudioTrack = new SkyWayRoomPackage.WebRtcAudioTrack(mediaStream.getAudioTracks()[0]);

                // 2. SkyWayサーバーへ接続
                context = await SkyWayContext.Create(SKYWAY_TOKEN);
                room = await SkyWayRoom.FindOrCreate(context, {
                    type: 'p2p',
                    name: 'main-voice-room'
                });

                // 3. ルームに参加し自分の声を送信
                me = await room.join();
                await me.publish(localAudioTrack);

                // UI更新
                statusDot.className = 'status-dot active';
                statusText.textContent = '通話中（音声共有中）';
                voiceBtn.textContent = '切断';
                voiceBtn.className = 'voice-btn active';
                isCalling = true;

                // 4. すでに部屋にいる、または後から入ってきた相手の声を聴く処理
                const subscribeAndPlay = async (publication) => {
                    if (publication.publisher.id === me.id) return; // 自分はスキップ
                    if (publication.contentType !== 'audio') return;

                    const { stream } = await me.subscribe(publication.id);
                    
                    // 音声エレメントを作成して再生
                    const remoteAudio = document.createElement('audio');
                    remoteAudio.srcObject = new MediaStream([stream.track]);
                    remoteAudio.autoplay = true;
                    audioContainer.appendChild(remoteAudio);
                };

                // 入室済みの人の音声を取得
                room.publications.forEach(subscribeAndPlay);
                // 後から入ってきた人の音声を取得
                room.onStreamPublished.add((e) => subscribeAndPlay(e.publication));

            } catch (err) {
                console.error(err);
                alert('接続エラーが発生しました。');
                resetUI();
            }
        } else {
            // 切断処理
            if (localAudioTrack) localAudioTrack.release();
            if (room) await room.leave();
            resetUI();
        }
    });

    function resetUI() {
        statusDot.className = 'status-dot';
        statusText.textContent = 'ボイス非接続';
        voiceBtn.textContent = '通話開始';
        voiceBtn.className = 'voice-btn';
        audioContainer.innerHTML = '';
        isCalling = false;
    }
</script>

</body>
</html>
