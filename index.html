<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>チャット</title>
    <style>
        :root {
            --border-color: #4a4a4a;
            --bg-color: #ffffff;
            --accent-color: #3b5998;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }

        /* 外部コンテナ（画像のレイアウトを再現） */
        .container {
            display: flex;
            width: 1000px;
            height: 600px;
            gap: 20px;
        }

        /* 飾り外枠（画像の二重線や装飾を表現） */
        .framed-box {
            border: 2px solid var(--border-color);
            border-radius: 12px;
            background: var(--bg-color);
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }

        /* 左側：メニューエリア */
        .left-panel {
            width: 200px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .admin-box {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }
        .admin-title {
            font-size: 24px;
            margin: 0;
        }
        .admin-btn {
            background: none;
            border: 1px solid #777;
            padding: 3px 10px;
            cursor: pointer;
            margin-top: 5px;
        }

        .menu-btn {
            padding: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
        }

        /* 中央：メインチャットエリア */
        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            position: relative;
        }

        .chat-header {
            font-size: 42px;
            font-weight: bold;
            text-align: center;
            margin: 0 0 20px 0;
            font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
        }

        .chat-messages {
            flex: 1;
            border-top: 2px solid var(--border-color);
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 70px;
        }

        .message-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .msg-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--accent-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .input-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
        }

        .chat-input {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid var(--border-color);
            border-radius: 30px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }

        /* 右側：ユーザーリストエリア */
        .right-panel {
            width: 240px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
        }

        .user-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            gap: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .user-item:hover {
            background: #f0f0f0;
        }

        .avatar-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #5c7bc6;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .username-text {
            font-size: 18px;
            color: #333;
        }

        /* モーダルウィンドウ（ユーザー情報・管理者ログイン・登録） */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 10px;
            width: 320px;
            text-align: center;
            border: 2px solid var(--border-color);
        }

        .modal-content h3 { margin-top: 0; }
        .modal-content input {
            width: 100%;
            padding: 8px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }

        .btn {
            padding: 8px 15px;
            border: 1px solid #777;
            background: white;
            cursor: pointer;
            border-radius: 4px;
        }
        .btn-danger {
            background: #ff4d4d;
            color: white;
            border: none;
        }

        /* 管理者状態バッジ */
        .admin-badge {
            display: none;
            color: red;
            font-weight: bold;
            font-size: 12px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- 左サイドバー -->
        <div class="left-panel">
            <div class="admin-box">
                <p class="admin-title">Admin</p>
                <button class="admin-btn" onclick="openAdminModal()">Sign in</button>
                <div class="admin-badge" id="adminBadge">管理者モード ON</div>
            </div>
            <div class="menu-btn framed-box">ROOM CHAT</div>
            <div class="menu-btn framed-box">DM</div>
        </div>

        <!-- 中央チャット画面 -->
        <div class="chat-panel framed-box">
            <h1 class="chat-header">チャット</h1>
            <div class="chat-messages" id="chatMessages">
                <!-- メッセージがここに流れます -->
            </div>
            <div class="input-container">
                <input type="text" class="chat-input" id="chatInput" placeholder="メッセージを入力してね" onkeypress="sendMessage(event)">
            </div>
        </div>

        <!-- 右サイドバー（ユーザーリスト） -->
        <div class="right-panel" id="userList">
            <!-- ユーザーリストが動的に生成されます -->
        </div>

    </div>

    <!-- モーダル1: 初回ユーザー登録 -->
    <div class="modal" id="registerModal" style="display: flex;">
        <div class="modal-content">
            <h3>プロファイル設定</h3>
            <input type="text" id="regUsername" placeholder="usernameを入力">
            <p style="font-size: 12px; color: #666;">※デモのためアイコンは自動生成されます</p>
            <button class="btn" onclick="registerUser()">入室する</button>
        </div>
    </div>

    <!-- モーダル2: 管理者サインイン -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <h3>管理者認証</h3>
            <input type="password" id="003kok25Password" placeholder="パスワードを入力 (admin)">
            <div class="modal-buttons">
                <button class="btn" onclick="verifyAdmin()">ログイン</button>
                <button class="btn" onclick="closeModal('adminModal')">キャンセル</button>
            </div>
        </div>
    </div>

    <!-- モーダル3: ユーザー詳細＆管理者権限アクション -->
    <div class="modal" id="userActionModal">
        <div class="modal-content">
            <h3 id="targetUserTitle">ユーザー名</h3>
            <p id="targetUserIP">IP: 192.168.1.XX</p>
            
            <!-- 管理者専用アクションエリア -->
            <div id="adminActions" style="display: none; border-top: 1px dashed #ccc; padding-top: 10px;">
                <p style="font-weight: bold; color: red; margin: 5px 0;">管理者コマンド</p>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                    <button class="btn btn-danger" onclick="executeAction('Kick OUT')">Kick OUT</button>
                    <button class="btn btn-danger" onclick="executeAction('BAN')">BAN</button>
                    <button class="btn" onclick="executeAction('BAN解除')">BAN解除</button>
                    <button class="btn btn-danger" onclick="executeAction('IPBAN')">IPBAN</button>
                    <button class="btn" onclick="executeAction('IPBAN解除')">IPBAN解除</button>
                </div>
            </div>
            
            <div class="modal-buttons" style="margin-top: 15px;">
                <button class="btn" onclick="closeModal('userActionModal')">閉じる</button>
            </div>
        </div>
    </div>

    <script>
        // ダミーデータと状態管理
        let currentUser = { username: "", avatar: "👤" };
        let isAdmin = false;
        let selectedUserIdx = null;

        // モックユーザーリスト
        const users = [
            { username: "username_A", ip: "192.168.1.10", banned: false, ipBanned: false },
            { username: "username_B", ip: "192.168.1.11", banned: false, ipBanned: false },
            { username: "username_C", ip: "192.168.1.12", banned: false, ipBanned: false },
            { username: "username_D", ip: "192.168.1.13", banned: false, ipBanned: false },
            { username: "username_E", ip: "192.168.1.14", banned: false, ipBanned: false }
        ];

        // 初回ユーザー登録
        function registerUser() {
            const name = document.getElementById('regUsername').value.trim();
            if(!name) return alert('ユーザー名を入力してください');
            currentUser.username = name;
            
            // リストに自分を追加
            users.unshift({ username: name, ip: "127.0.0.1", banned: false, ipBanned: false });
            
            document.getElementById('registerModal').style.display = 'none';
