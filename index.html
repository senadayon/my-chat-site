<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web通話</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #0e1118;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #1c2331;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            box-sizing: border-box;
            margin-top: 40px;
        }
        h1 {
            text-align: center;
            color: #4f46e5;
            margin-bottom: 25px;
        }
        .status {
            text-align: center;
            padding: 12px;
            background: #2d3748;
            border-radius: 6px;
            margin-bottom: 20px;
            font-weight: bold;
            border: 1px solid #4a5568;
        }
        .control-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #4a5568;
            background: #2d3748;
            color: white;
            box-sizing: border-box;
            font-size: 16px;
        }
        input[type="range"] {
            width: 100%;
            margin-top: 5px;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #4338ca;
        }
        .btn-disconnect {
            background: #dc2626;
            margin-top: 10px;
            display: none;
        }
        .btn-disconnect:hover {
            background: #b91c1c;
        }
        .value-display {
            float: right;
            color: #a0aec0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Web通話</h1>
    
    <!-- 初期状態は「接続を待機中...」にしておき、エラーが起きたら詳細を表示します -->
    <div id="status" class="status">通話を開始してください</div>

    <!-- ルーム設定 -->
    <div class="control-group">
        <label for="roomId">ルームID（通話相手と同じIDを入力）</label>
        <input type="text" id="roomId" value="mirotalk-room-123">
    </div>

    <!-- ボイスチェンジャー設定 -->
    <div class="control-group">
        <label for="pitchRange">高さ <span id="pitchValue" class="value-display">1.0 (標準)</span></label>
        <input type="range" id="pitchRange" min="0.5" max="2.0" step="0.1" value="1.0">
    </div>

    <div class="control-group">
        <label for="presetSelect">関係なし</label>
        <select id="presetSelect">
            <option value="1.0">カスタム（スライダーで調整）</option>
            <option value="1.5">女性風・高い声</option>
            <option value="1.8">ちびキャラ風</option>
            <option value="0.7">男性風・低い声</option>
            <option value="0.5">ロボット・怪獣風</option>
        </select>
    </div>

    <button id="startBtn" class="btn">通話を開始する（マイク許可が必要）</button>
    <button id="stopBtn" class="btn btn-disconnect">切断する</button>
</div>

<!-- WebRTCの通信ライブラリ -->
<script src="https://unpkg.com"></script>
<script>
    let peer = null;
    let currentCall = null;
    let localStream = null;
    let audioCtx = null;
    let biquadFilter = null;
    let mediaStreamSource = null;
    let destination = null;

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusDiv = document.getElementById('status');
    const roomIdInput = document.getElementById('roomId');
    const pitchRange = document.getElementById('pitchRange');
    const pitchValue = document.getElementById('pitchValue');
    const presetSelect = document.getElementById('presetSelect');

    // スライダー変更時の処理
    pitchRange.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value).toFixed(1);
        pitchValue.innerText = `${val} (${val == 1.0 ? '標準' : val > 1.0 ? '高い声' : '低い声'})`;
        updateVoiceEffect();
    });

    // プリセット変更時の処理
    presetSelect.addEventListener('change', (e) => {
        pitchRange.value = e.target.value;
        pitchRange.dispatchEvent(new Event('input'));
    });

    // 通話開始処理（ボタンを押した時に初めてマイクを起動する安全な設計に変更）
    startBtn.addEventListener('click', async () => {
        const roomId = roomIdInput.value.trim();
        if (!roomId) {
            alert('ルームIDを入力してください');
            return;
        }

        statusDiv.innerText = "マイクに接続中...";

        try {
            // ボタンを押した瞬間にマイクを要求することで、ブラウザの許可設定を確実に同期させます
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            
            // 音声プロセッサのセットアップ
            setupAudioProcessor(localStream);

            // ピア（通信）の作成
            const myPeerId = roomId + '-' + Math.floor(Math.random() * 1000);
            peer = new Peer(myPeerId);

            peer.on('open', (id) => {
                statusDiv.innerText = `ルームに参加しました！あなたのID: ${id}`;
                startBtn.style.display = 'none';
                stopBtn.style.display = 'block';
            });

            // 相手からの着信処理
            peer.on('call', (call) => {
                currentCall = call;
                // ボイチェン加工した音声を相手に送信
                call.answer(destination.stream);
                
                call.on('stream', (remoteStream) => {
                    playRemoteStream(remoteStream);
                    statusDiv.innerText = "通話中（ボイチェン適用中）";
                });
            });

        } catch (err) {
            console.error(err);
            // 万が一失敗した場合、原因を特定しやすくするために英語のエラー名（NotAllowedError等）も画面に表示します
            statusDiv.innerText = "エラー: マイクの接続に失敗しました（" + err.name + "）";
        }
    });

    // Web Audio API によるボイチェン処理
    function setupAudioProcessor(stream) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        mediaStreamSource = audioCtx.createMediaStreamSource(stream);
        destination = audioCtx.createMediaStreamDestination();

        biquadFilter = audioCtx.createBiquadFilter();
        biquadFilter.type = "peaking";
        
        mediaStreamSource.connect(biquadFilter);
        biquadFilter.connect(destination);
        
        updateVoiceEffect();
    }

    function updateVoiceEffect() {
        if (!biquadFilter) return;
        const pitch = parseFloat(pitchRange.value);
        biquadFilter.frequency.value = 1000 * pitch;
        biquadFilter.Q.value = 2.0;
        biquadFilter.gain.value = pitch > 1.0 ? 5 : -5;
    }

    // 相手の音声を再生
    function playRemoteStream(remoteStream) {
        const audio = document.createElement('audio');
        audio.srcObject = remoteStream;
        audio.autoplay = true;
        document.body.appendChild(audio);
    }

    // 切断処理
    stopBtn.addEventListener('click', () => {
        if (currentCall) currentCall.close();
        if (peer) peer.destroy();
        if (localStream) {
            localStream.getTracks().forEach(track => track.stop());
        }
        if (audioCtx) audioCtx.close();

        statusDiv.innerText = "切断されました。";
        startBtn.style.display = 'block';
        stopBtn.style.display = 'none';
    });
</script>

</body>
</html>
