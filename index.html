<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拡張機能付き Webチャット</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f5f7fb;
            --chat-bg: #ffffff;
            --text-color: #333;
            --admin-color: #e74c3c;
        }
        /* bodyの綴りミス(hieght)を修正しました */
        body { 
            font-family: sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            color: var(--text-color); 
        }
        .hidden { display: none !important; }
        
        /* ログイン・初期設定画面 */
        .modal { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 320px; text-align: center; }
        .modal h2 { margin-top: 0; }
        .modal input[type="text"], .modal input[type="password"] { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .modal button { width: 100%; padding: 10px; background: var(--primary-color); border: none; color: #fff; font-size: 16px; border-radius: 6px; cursor: pointer; }
        .avatar-selection { display: flex; justify-content: space-around; margin: 15px 0; }
        .avatar-opt { width: 50px; height: 50px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: 0.2s; }
        .avatar-opt.selected { border-color: var(--primary-color); }

        /* メインチャット画面 */
        .chat-container { width: 900px; height: 600px; background: var(--chat-bg); border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); display: flex; overflow: hidden; }
        .chat-main { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #eee; }
        .chat-header { padding: 15px; background: var(--primary-color); color: #fff; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .admin-btn { background: rgba(255,255,255,0.2); border: 1px solid #fff; color: #fff; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .admin-btn.active { background: var(--admin-color); border-color: var(--admin-color); }
        
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .msg { display: flex; align-items: flex-start; gap: 10px; }
        .msg img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .msg-body { max-width: 70%; }
        .msg-name { font-size: 12px; color: #777; margin-bottom: 3px; display: flex; align-items: center; gap: 5px; }
        .msg-text { background: #edf2f7; padding: 10px 14px; border-radius: 0 12px 12px 12px; font-size: 14px; word-break: break-all; }
        .msg.me { flex-direction: row-reverse; }
        .msg.me .msg-text { background: var(--primary-color); color: #fff; border-radius: 12px 0 12px 12px; }
        .msg.me .msg-name { justify-content: flex-end; }
        
        .chat-input-area { padding: 15px; display: flex; gap: 10px; border-top: 1px solid #eee; }
        .chat-input-area input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 6px; outline: none; }
        .chat-input-area button { padding: 0 20px; background: var(--primary-color); color: #fff; border: none; border-radius: 6px; cursor: pointer; }

        /* 管理者拡張機能：ユーザー一覧サイドバー */
        .admin-sidebar { width: 280px; background: #f8f9fa; display: flex; flex-direction: column; }
        .sidebar-header { padding: 15px; background: #343a40; color: #fff; font-weight: bold; }
        .user-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        .user-card { background: #fff; padding: 10px; border-radius: 6px; border: 1px solid #ddd; }
        .user-info { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .user-info img { width: 30px; height: 30px; border-radius: 50%; }
        .user-meta { font-size: 11px; color: #666; }
        .action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
        .action-btns button { font-size: 11px; padding: 4px; border: none; border-radius: 3px; cursor: pointer; color: #fff; }
        .btn-kick { background: #f39c12; }
        .btn-ban { background: #e74c3c; }
        .btn-unban { background: #2ecc71; }
        .btn-ipban { background: #9b59b6; }
    </style>
</head>
<body>

    <!-- 1. ログイン画面（ユーザー名＆アイコン要求） -->
    <div id="login-screen" class="modal">
        <h2>チャットへ参加</h2>
        <input type="text" id="username-input" placeholder="ユーザー名を入力..." required>
        <p style="font-size: 14px; color: #666; margin-bottom: 5px;">アイコンを選択</p>
        <div class="avatar-selection">
            <img src="https://dicebear.com" class="avatar-opt selected" onclick="selectAvatar(this)">
            <img src="https://dicebear.com" class="avatar-opt" onclick="selectAvatar(this)">
            <img src="https://dicebear.com" class="avatar-opt" onclick="selectAvatar(this)">
        </div>
        <button onclick="joinChat()">入室する</button>
    </div>

    <!-- 2. パスワード要求モーダル（管理者用） -->
    <div id="admin-auth-modal" class="modal hidden" style="position: absolute; z-index: 100; box-shadow: 0 4px 30px rgba(0,0,0,0.3);">
        <h3>管理者パスワード入力</h3>
        <p style="font-size: 12px; color: #777;">パスワード: admin123</p>
        <input type="password" id="admin-password" placeholder="パスワードを入力">
        <button onclick="verifyAdmin()" style="background: var(--admin-color);">認証</button>
        <button onclick="closeAdminModal()" style="background: #999; margin-top: 5px;">キャンセル</button>
    </div>

    <!-- 3. メインチャット画面 -->
    <div id="chat-screen" class="chat-container hidden">
        <div class="chat-main">
            <div class="chat-header">
                <span>💬 Web Chat Room</span>
                <button id="admin-toggle-btn" class="admin-btn" onclick="openAdminModal()">管理者モード</button>
            </div>
            <div class="chat-messages" id="chat-messages">
                <!-- メッセージがここに追加されます -->
            </div>
            <div class="chat-input-area">
                <input type="text" id="message-input" placeholder="メッセージを入力..." onkeypress="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()">送信</button>
            </div>
        </div>

        <!-- 拡張機能：管理者専用ユーザーアカウント表示画面 -->
        <div id="admin-sidebar" class="admin-sidebar hidden">
            <div class="sidebar-header">🛡️ ユーザー管理（管理者）</div>
            <div class="user-list" id="user-list">
                <!-- ユーザーアカウント情報とBAN/Kickボタンがここに生成されます -->
            </div>
        </div>
    </div>

    <script>
        let currentUser = { name: '', avatar: '', isAdmin: false, ip: '192.168.1.5' };
        let selectedAvatarUrl = 'https://dicebear.com';
        
        const mockUsers = [
            { id: 1, name: "サンプルユーザーA", avatar: "https://dicebear.com", ip: "192.168.1.10", status: "Active" },
            { id: 2, name: "荒らしアカウントB", avatar: "https://dicebear.com", ip: "203.0.113.5", status: "Active" },
            { id: 3, name: "BAN済みユーザーC", avatar: "https://dicebear.com", ip: "198.51.100.22", status: "Banned" }
        ];

        function selectAvatar(element) {
            document.querySelectorAll('.avatar-opt').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            selectedAvatarUrl = element.src;
        }

        function joinChat() {
            const name = document.getElementById('username-input').value.trim();
            if (!name) return alert('ユーザー名を入力してください');
            
            currentUser.name = name;
            currentUser.avatar = selectedAvatarUrl;
            
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');
            
            addSystemMessage(`${currentUser.name} さんが入室しました。`);
        }

        function openAdminModal() {
            if (currentUser.isAdmin) {
                currentUser.isAdmin = false;
                document.getElementById('admin-toggle-btn').classList.remove('active');
                document.getElementById('admin-toggle-btn').innerText = "管理者モード";
                document.getElementById('admin-sidebar').classList.add('hidden');
                addSystemMessage("管理者モードを終了しました。");
            } else {
                document.getElementById('admin-auth-modal').classList.remove('hidden');
            }
        }

        function closeAdminModal() {
            document.getElementById('admin-auth-modal').classList.add('hidden');
            document.getElementById('admin-password').value = '';
        }

        function verifyAdmin() {
            const pass = document.getElementById('admin-password').value;
            if (pass === 'admin123') {
                currentUser.isAdmin = true;
                document.getElementById('admin-toggle-btn').classList.add('active');
                document.getElementById('admin-toggle-btn').innerText = "管理者: ON";
                document.getElementById('admin-sidebar').classList.remove('hidden');
                closeAdminModal();
                renderUserList();
                addSystemMessage("管理者権限が有効化されました。");
            } else {
                alert('パスワードが違います！');
            }
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;
