<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リアルタイム風オンラインチャット</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-container { width: 100%; max-width: 450px; height: 85vh; background: #fff; box-shadow: 0 12px 28px rgba(0,0,0,0.12); display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; }
        .chat-header { background: #075e54; color: white; padding: 15px; text-align: center; font-size: 1.1rem; font-weight: bold; }
        .message-area { flex: 1; padding: 15px; overflow-y: auto; background: #efeae2; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 75%; padding: 10px 14px; border-radius: 8px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; position: relative; }
        .msg-left { background: #fff; align-self: flex-start; border-top-left-radius: 0; }
        .msg-right { background: #d9fdd3; align-self: flex-end; border-top-right-radius: 0; }
        .meta-info { font-size: 0.7rem; color: #667781; margin-top: 4px; display: block; text-align: right; }
        .input-area { display: flex; padding: 10px; background: #f0f2f5; border-top: 1px solid #e1e1e1; gap: 8px; }
        input[type="text"] { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 24px; outline: none; font-size: 1rem; }
        input[type="text"]:focus { border-color: #075e54; }
        button { background: #075e54; color: white; border: none; padding: 0 20px; border-radius: 24px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #128c7e; }
        .user-toggle { font-size: 0.8rem; background: #e1e1e1; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; align-self: center; margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">🌐 オンラインチャットルーム</div>
    
    <!-- 擬似的に送信者を切り替えるボタン（開発・テスト用） -->
    <button class="user-toggle" id="userToggle" onclick="toggleUser()">現在の送信者: あなた (右側)</button>
    
    <div class="message-area" id="messageArea">
        <div class="message msg-left">
            チャットへようこそ！下のフォームからメッセージを送信してみましょう。
            <span class="meta-info">システム ・ たった今</span>
        </div>
    </div>
    
    <div class="input-area">
        <input type="text" id="messageInput" placeholder="メッセージを入力..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">送信</button>
    </div>
</div>

<script>
    // ブラウザのLocalStorageを使って簡易的に別タブ同士の通信を再現
    let isCurrentUser = true;

    // 送信者を切り替える関数（1つの画面でテストするため）
    function toggleUser() {
        isCurrentUser = !isCurrentUser;
        const btn = document.getElementById('userToggle');
        btn.innerText = isCurrentUser ? "現在の送信者: あなた (右側)" : "現在の送信者: 相手 (左側)";
    }

    // メッセージ送信処理
    function sendMessage() {
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (text === '') return;

        const timestamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        
        const messageData = {
            text: text,
            sender: isCurrentUser ? 'right' : 'left',
            time: timestamp,
            id: Date.now()
        };

        // 画面に描画
        appendMessage(messageData);

        // 別タブにもリアルタイム反映させるためにストレージに保存
        localStorage.setItem('chat_new_message', JSON.stringify(messageData));

        input.value = '';
    }

    // 画面にメッセージを追加する関数
    function appendMessage(data) {
        const messageArea = document.getElementById('messageArea');
        const msgDiv = document.createElement('div');
        
        msgDiv.className = `message ${data.sender === 'right' ? 'msg-right' : 'msg-left'}`;
        msgDiv.innerHTML = `${escapeHTML(data.text)}<span class="meta-info">${data.time}</span>`;
        
        messageArea.appendChild(msgDiv);
        messageArea.scrollTop = messageArea.scrollHeight; // 常に最新メッセージへスクロール
    }

    // エンターキーでも送信できるようにする
    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }

    // XSS対策の簡易エスケープ
    function escapeHTML(str) {
        return str.replace(/[&<>"']/g, match => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[match]));
    }

    // 別のタブで開いたとき、メッセージを同期させるイベントリスナー
    window.addEventListener('storage', (event) => {
        if (event.key === 'chat_new_message' && event.newValue) {
            const data = JSON.parse(event.newValue);
            // 別のタブから来たメッセージは、自分とは逆の立場として表示
            data.sender = (data.sender === 'right') ? 'left' : 'right';
            appendMessage(data);
        }
    });
</script>

</body>
</html>
