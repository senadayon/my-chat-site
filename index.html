<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リアルタイム AI風 女声ボイスチェンジャー</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #ffe5ec, #ffc2d1);
            color: #4a4a4a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #ff5c8a;
            font-size: 24px;
            margin-bottom: 20px;
        }
        button {
            background-color: #ff7096;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 112, 150, 0.4);
            width: 100%;
            margin-bottom: 25px;
        }
        button:hover {
            background-color: #ff5c8a;
            transform: translateY(-2px);
        }
        button.active {
            background-color: #47c17e;
            box-shadow: 0 4px 15px rgba(71, 193, 126, 0.4);
        }
        .control-group {
            margin: 20px 0;
            text-align: left;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #666;
            font-size: 14px;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #ff7096;
        }
        .value-display {
            float: right;
            font-weight: normal;
            color: #ff7096;
        }
        .tips {
            font-size: 12px;
            color: #888;
            margin-top: 20px;
            line-height: 1.5;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>リアルタイム女声ボイチェン</h1>
    <button id="startBtn">ボイチェンを開始する</button>

    <div class="control-group">
        <label>ピッチ (音の高さ): <span id="pitchVal" class="value-display">1.50</span></label>
        <input type="range" id="pitchSlider" min="1.0" max="2.0" step="0.05" value="1.50">
    </div>

    <div class="control-group">
        <label>フォルマント (女声補正フィルター): <span id="formantVal" class="value-display">3000Hz</span></label>
        <input type="range" id="formantSlider" min="2000" max="5000" step="100" value="3000">
    </div>

    <div class="tips">
        💡 <strong>綺麗に変換するコツ:</strong><br>
        ・必ず<strong>イヤホンかヘッドホン</strong>をつけてください（ハウリングします）。<br>
        ・ピッチは「1.3〜1.6」、フォルマントは「3000Hz辺り」がおすすめです。<br>
        ・少し高めの裏声を意識して喋ると自然な女声になります。
    </div>
</div>

<script>
    let audioCtx = null;
    let microphone = null;
    let processor = null;
    let biquadFilter = null;
    let isPlaying = false;

    const startBtn = document.getElementById('startBtn');
    const pitchSlider = document.getElementById('pitchSlider');
    const formantSlider = document.getElementById('formantSlider');
    const pitchVal = document.getElementById('pitchVal');
    const formantVal = document.getElementById('formantVal');

    // スライダー変更のリスナー
    pitchSlider.addEventListener('input', (e) => pitchVal.textContent = parseFloat(e.target.value).toFixed(2));
    formantSlider.addEventListener('input', (e) => {
        formantVal.textContent = e.target.value + 'Hz';
        if (biquadFilter) biquadFilter.frequency.setValueAtTime(e.target.value, audioCtx.currentTime);
    });

    startBtn.addEventListener('click', async () => {
        if (isPlaying) {
            // 停止処理
            if (audioCtx) audioCtx.close();
            startBtn.textContent = 'ボイチェンを開始する';
            startBtn.classList.remove('active');
            isPlaying = false;
            return;
        }

        try {
            // マイクの許可を取得
            const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
            
            // AudioContextの初期化
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            microphone = audioCtx.createMediaStreamSource(stream);
            
            // リアルタイム音声処理ノード (バッファサイズ: 1024で遅延を最小化)
            processor = audioCtx.createScriptProcessor(1024, 1, 1);
            
            // フォルマント（特定の周波数強調）をシミュレートするフィルター
            biquadFilter = audioCtx.createBiquadFilter();
            biquadFilter.type = 'peaking';
            biquadFilter.Q.setValueAtTime(4.0, audioCtx.currentTime); // 強調の鋭さ
            biquadFilter.gain.setValueAtTime(8, audioCtx.currentTime); // 強調量
            biquadFilter.frequency.setValueAtTime(formantSlider.value, audioCtx.currentTime);

            // ピッチ変換の数理ロジック (簡易フェーズボコーダ/線形補間)
            processor.onaudioprocess = (e) => {
                const inputBuffer = e.inputBuffer;
                const outputBuffer = e.outputBuffer;
                const inputData = inputBuffer.getChannelData(0);
                const outputData = outputBuffer.getChannelData(0);
                
                const pitch = parseFloat(pitchSlider.value);
                const length = inputData.length;

                // 再サンプリングによるピッチ変更
                for (let i = 0; i < length; i++) {
                    let sourceIndex = i * pitch;
                    if (sourceIndex < length - 1) {
                        let index = Math.floor(sourceIndex);
                        let frac = sourceIndex - index;
                        // 線形補間
                        outputData[i] = inputData[index] * (1 - frac) + inputData[index + 1] * frac;
                    } else {
                        outputData[i] = 0;
                    }
                }
            };

            // オーディオグラフの接続: マイク -> ピッチ変換 -> フォルマントフィルター -> スピーカー
            microphone.connect(processor);
            processor.connect(biquadFilter);
            biquadFilter.connect(audioCtx.destination);

            startBtn.textContent = 'ボイチェン作動中 (クリックで停止)';
            startBtn.classList.add('active');
            isPlaying = true;

        } catch (err) {
            alert('マイクのアクセスが拒否されたか、マイクが見つかりません: ' + err);
        }
    });
</script>

</body>
</html>
