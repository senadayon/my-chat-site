<a href="javascript:(function(){
    setInterval(function(){ Game.ClickCookie(); }, 1);
    setInterval(function(){ Game.shimmers.forEach(function(shimmer){ shimmer.pop(); }); }, 500);
    setInterval(function(){
        if(Game.UpgradesInStore.length > 0){ let u = Game.UpgradesInStore[0]; if(u.canBuy()) u.buy(); }
        let bp = null; let m = Infinity;
        Game.ObjectsById.forEach(function(o){ let c = o.getPrice() / Math.max(o.storedCps, 0.1); if(c < m && o.getPrice() <= Game.cookies){ m = c; bp = o; } });
        if(bp) bp.buy();
    }, 1000);
})();">クッキークリッカー自動化ツール</a>
