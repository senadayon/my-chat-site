<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Mode Admin Chat</title>
    <style>
        :root {
            --bg-main: #121212;
            --bg-sidebar: #1e1e1e;
            --bg-card: #2a2a2a;
            --bg-input: #333333;
            --text-main: #e0e0e0;
            --text-sub: #aaaaaa;
            --accent: #bb86fc;
            --danger: #cf6679;
            --success: #03dac6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ログイン・初期設定画面 */
        #login-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-main);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .login-box {
            background: var(--bg-sidebar);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 350px;
            text-align: center;
        }

        .login-box h2 { margin-bottom: 20px; color: var(--accent); }
        
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 5px;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            background: var(--bg-input);
            border: 1px solid #444;
            border-radius: 6px;
            color: var(--text-main);
            outline: none;
        }

        .avatar-select {
            display: flex;
            justify-content: space-around;
            margin-top: 10px;
        }

        .avatar-option {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-card);
        }

        .avatar-option.selected {
            border-color: var(--accent);
        }

        button {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            border: none;
            border-radius: 6px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.9; }

        /* メインレイアウト */
        #chat-app {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* サイドバー（管理者＆ユーザーリスト） */
        .sidebar {
            width: 320px;
            background: var(--bg-sidebar);
            border-right: 1px solid #222;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .admin-section {
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
            margin-bottom: 20px;
        }

        .admin-btn {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
        }
        .admin-btn.active {
            background: var(--danger);
            color: #fff;
            border: none;
        }

        .user-list-section h3 {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .user-item {
            display: flex;
            align-items: center;
            padding: 10px;
            background: var(--bg-card);
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            position: relative;
        }

        .user-item:hover {
            background: #333;
        }

        .user-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: #444;
            margin-right: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .user-info { flex-grow: 1; }
        .user-name { font-weight: 500; font-size: 14px; }
        .user-ip { font-size: 11px; color: var(--text-sub); }

        .admin-badge {
            font-size: 10px;
            background: var(--accent);
            color: #000;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }

        /* メインチャットエリア */
        .chat-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-main);
        }

        .chat-header {
            padding: 20px;
            background: var(--bg-sidebar);
            border-bottom: 1px solid #222;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .messages-container {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            align-items: flex-start;
        }

        .msg-content {
            background: var(--bg-card);
            padding: 10px 15px;
            border-radius: 0 12px 12px 12px;
            max-width: 70%;
        }

        .message.self {
            flex-direction: row-reverse;
        }

        .message.self .msg-content {
            background: var(--accent);
            color: #000;
            border-radius: 12px 0 12px 12px;
        }

        .msg-header {
            display: flex;
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 5px;
            gap: 8px;
        }
        .message.self .msg-header { flex-direction: row-reverse; color: #333; }

        .chat-input-area {
            padding: 20px;
            background: var(--bg-sidebar);
            display: flex;
            gap: 10px;
        }

        .chat-input-area input { flex-grow: 1; }
        .chat-input-area button { width: auto; margin: 0; padding: 0 25px; }

        /* 管理者用アカウント操作モーダル */
        #admin-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        .modal-content {
            background: var(--bg-sidebar);
            padding: 25px;
            border-radius: 12px;
            width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .modal-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-kick { background: #f4b400; color: #000; }
        .btn-ban { background: #db4437; color: #fff; }
        .btn-unban { background: #0f9d58; color: #fff; }
        .btn-ipban { background: #7b1fa2; color: #fff; }
        .btn-unipban { background: #00acc1; color: #fff; }
        .btn-close { background: #555; color: #fff; grid-column: span 2; }
    </style>
</head>
<body>

    <!-- 1. ユーザー情報要求（ログイン画面） -->
    <div id="login-screen">
        <div class="login-box">
            <h2>Chat Join</h2>
            <div class="input-group">
                <label>ユーザー名</label>
                <input type="text" id="username-input" placeholder="名前を入力..." required>
            </div>
            <div class="input-group">
                <label>アイコン（アバター）を選択</label>
                <div class="avatar-select">
                    <div class="avatar-option selected" onclick="selectAvatar(this)">🐱</div>
                    <div class="avatar-option" onclick="selectAvatar(this)">🦊</div>
                    <div class="avatar-option" onclick="selectAvatar(this)">🤖</div>
                    <div class="avatar-option" onclick="selectAvatar(this)">🥷</div>
                </div>
            </div>
            <button onclick="joinChat()">チャットに入る</button>
        </div>
    </div>

    <!-- 2. メインアプリ画面 -->
    <div id="chat-app">
        <!-- サイドバー -->
        <div class="sidebar">
            <!-- 管理者モード切替セクション -->
            <div class="admin-section">
                <button id="admin-toggle-btn" class="admin-btn" onclick="promptAdminPassword()">管理者モードになる</button>
            </div>

            <!-- ユーザーアカウント一覧画面（拡張機能） -->
            <div class="user-list-section">
                <h3>ユーザーアカウント表示 (管理用)</h3>
                <div id="user-list">
                    <!-- サンプルユーザーデータ -->
                    <div class="user-item" onclick="openAdminPanel('UserA', '🐱', '192.168.1.5')">
                        <div class="user-avatar">🐱</div>
                        <div class="user-info">
                            <div class="user-name">UserA</div>
                            <div class="user-ip">IP: 192.168.1.5</div>
                        </div>
                    </div>
                    <div class="user-item" onclick="openAdminPanel('UserB', '🦊', '192.168.1.12')">
                        <div class="user-avatar">🦊</div>
                        <div class="user-info">
