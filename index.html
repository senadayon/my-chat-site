<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC ボイチャ＆テキストチャット</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 10px; }
        #chat-box { height: 200px; border: 1px solid #ccc; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #f9f9f9; }
        .controls { margin-bottom: 15px; background: #eee; padding: 10px; border-radius: 5px; }
        textarea { width: 100%; height: 60px; }
        button { padding: 8px 15px; margin: 5px 2px; cursor: pointer; }
        .status { font-weight: bold; color: #0066cc; }
    </style>
</head>
<body>

    <h2>🗣️ ボイチャ＆テキストチャット</h2>
    
    <div class="controls">
        <p>状態: <span id="status" class="status">シグナリングサーバー接続待ち...</span></p>
        <button id="start-voice">🎤 マイクを許可してボイチャ準備</button>
        <button id="call-btn" disabled>📞 通話接続 (発信)</button>
    </div>

    <div id="chat-box"></div>
    <textarea id="msg-input" placeholder="メッセージを入力..." disabled></textarea>
    <button id="send-btn" disabled>送信</button>

    <!-- 音声再生用の隠し要素 -->
    <audio id="remote-audio" autoplay></audio>

    <!-- 無料で使えるパブリックなシグナリングサーバー（テスト用） -->
    <script src="https://unpkg.com"></script>
    <script>
        // 本来は自分でサーバーを立てますが、テスト用に無料のPeerJS公開サーバーを利用します
        const peer = new Peer();
        let localStream = null;
        let dataConnection = null;

        const statusText = document.getElementById('status');
        const startVoiceBtn = document.getElementById('start-voice');
        const callBtn = document.getElementById('call-btn');
        const chatBox = document.getElementById('chat-box');
        const msgInput = document.getElementById('msg-input');
        const sendBtn = document.getElementById('send-btn');
        const remoteAudio = document.getElementById('remote-audio');

        // 1. サーバー接続完了時、自分のIDを表示
        peer.on('open', (id) => {
            statusText.innerText = `あなたのID: ${id} (このIDを相手に伝えてください)`;
            window.myId = id;
        });

        // 2. マイクの準備
        startVoiceBtn.addEventListener('click', async () => {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                statusText.innerText = "マイク準備完了！相手のIDを入力して発信するか、接続を待ってください。";
                startVoiceBtn.disabled = true;
                callBtn.disabled = false;
            } catch (err) {
                alert("マイクの許可に失敗しました: " + err);
            }
        });

        // 3. 自分から相手に接続する場合（発信）
        callBtn.addEventListener('click', () => {
            const targetId = prompt("接続したい相手のIDを入力してください:");
            if (!targetId) return;

            // テキスト用のデータ接続
            dataConnection = peer.connect(targetId);
            setupDataConnection(dataConnection);

            // 音声用の通話接続
            if (localStream) {
                const call = peer.call(targetId, localStream);
                setupCallConnection(call);
            }
        });

        // 4. 相手からの接続を受け付ける場合（着信）
        peer.on('connection', (conn) => {
            dataConnection = conn;
            setupDataConnection(dataConnection);
        });

        peer.on('call', (call) => {
            if (localStream) {
                call.answer(localStream); // 自分のマイク音声を返して通話開始
                setupCallConnection(call);
            } else {
                alert("相手から通話が来ましたが、こちらのマイクが準備できていません。");
            }
        });

        // データ通信（チャット）の設定
        function setupDataConnection(conn) {
            conn.on('open', () => {
                statusText.innerText = "チャット接続完了！";
                msgInput.disabled = false;
                sendBtn.disabled = false;
            });

            conn.on('data', (data) => {
                appendMessage("相手", data);
            });
        }

        // 音通信（ボイチャ）の設定
        function setupCallConnection(call) {
            call.on('stream', (remoteStream) => {
                remoteAudio.srcObject = remoteStream; // 相手の声を再生
                statusText.innerText = "ボイチャ通話中！";
            });
        }

        // メッセージ送信処理
        sendBtn.addEventListener('click', () => {
            const msg = msgInput.value;
            if (!msg || !dataConnection) return;
            
            dataConnection.send(msg);
            appendMessage("あなた", msg);
            msgInput.value = "";
        });

        function appendMessage(sender, text) {
            const div = document.createElement('div');
            div.innerText = `${sender}: ${text}`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
