<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web通話</title>
    <style>
        /* 全体の背景と文字スタイル設定 */
        body {
            background-color: #0b111e;
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* 中央のメインコンテナ */
        .container {
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 8px;
            width: 450px;
            padding: 30px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        /* メインタイトル */
        h1 {
            color: #4f46e5;
            text-align: center;
            font-size: 24px;
            margin-bottom: 25px;
        }

        /* 接続ステータスバー */
        .status-bar {
            background-color: #1f2937;
            color: #9ca3af;
            text-align: center;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* 各入力項目のグループ */
        .form-group {
            margin-bottom: 20px;
        }

        /* ラベルのスタイル */
        label {
            display: block;
            font-size: 13px;
            color: #d1d5db;
            margin-bottom: 8px;
        }

        /* テキスト入力欄 */
        input[type="text"] {
            width: 100%;
            background-color: #1f2937;
            border: 1px solid #374151;
            color: #ffffff;
            padding: 12px;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        /* スライダーと数値の横並び調整 */
        .slider-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* 横幅いっぱいのスライダー */
        input[type="range"] {
            flex-grow: 1;
            margin-right: 15px;
            accent-color: #3b82f6; /* 青色のつまみ */
        }

        .slider-value {
            font-size: 13px;
            color: #9ca3af;
            white-space: nowrap;
        }

        /* セレクトボックス（ドロップダウン） */
        select {
            width: 100%;
            background-color: #1f2937;
            border: 1px solid #374151;
            color: #ffffff;
            padding: 12px;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            appearance: none; /* デフォルトの矢印をリセット */
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%239ca3af' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px;
        }

        /* 通話開始ボタン */
        .submit-btn {
            width: 100%;
            background-color: #4f46e5;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .submit-btn:hover {
            background-color: #4338ca;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Web通話</h1>
        
        <div class="status-bar">
            接続を待機中...
        </div>

        <div class="form-group">
            <label>ルームID（通話相手と同じIDを入力）</label>
            <input type="text" value="mirotalk-room-123">
        </div>

        <div class="form-group">
            <label>ピッチ（声の高さ）</label>
            <div class="slider-container">
                <input type="range" min="0.5" max="2.0" step="0.1" value="1.5">
                <span class="slider-value">1.5 (高い声)</span>
            </div>
        </div>

        <div class="form-group">
            <label>ボイスプリセット</label>
            <select>
                <option>女性風・高い声</option>
                <option>男性風・低い声</option>
                <option>ロボットボイス</option>
            </select>
        </div>

        <button class="submit-btn">通話を開始する（マイク許可が必要）</button>
    </div>

</body>
</html>
