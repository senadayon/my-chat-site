<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通話アプリ</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f2f5; padding: 20px; }
        .container { max-width: 400px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button { font-size: 16px; padding: 10px 20px; margin: 10px; cursor: pointer; border: none; border-radius: 5px; background: #007bff; color: white; }
        button:disabled { background: #ccc; }
        select { font-size: 16px; padding: 10px; width: 80%; margin: 10px 0; }
        .status { font-weight: bold; margin: 15px 0; color: #555; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎙️ ボイチェン通話テスト</h2>
    
    <label for="voiceEffect">声のエフェクトを選択：</label>
    <select id="voiceEffect">
        <option value="normal">ノーマル（そのまま）</option>
        <option value="high">高い声（ヘリウム風）</option>
        <option value="low">低い声（ダースベイダー風）</option>
        <option value="robot">ロボットボイス</option>
    </select>

    <div class="status" id="status">ボタンを押してマイクを通話に接続してください</div>
    
    <button id="startBtn">通話・接続開始</button>
    <button id="stopBtn" disabled>切断</button>
</div>

<script>
    let audioCtx;
    let microphone;
    let biquadFilter;
    let delayNode;
    let feedbackNode;
    let waveShaper;
    let localStream;

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusText = document.getElementById('status');
    const voiceEffect = document.getElementById('voiceEffect');

    // ボイチェンの仕組みを構築する関数
    async function setupAudio() {
        try {
            // マイク入力を取得
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            
            // Web Audio APIの初期化
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            microphone = audioCtx.createMediaStreamSource(localStream);
            
            // エフェクト用ノードの作成
            biquadFilter = audioCtx.createBiquadFilter();
            delayNode = audioCtx.createDelay();
            feedbackNode = audioCtx.createGain();
            waveShaper = audioCtx.createWaveShaper();

            // ロボット用の設定
            delayNode.delayTime.value = 0.015;
            feedbackNode.gain.value = 0.5;

            // 初期状態はノーマル接続
            updateEffect();

            statusText.innerText = "🎵 通話接続中（自分の声が加工されてスピーカーから出ます）";
            startBtn.disabled = true;
            stopBtn.disabled = false;
        } catch (err) {
            console.error(err);
            statusText.innerText = "❌ マイクの許可が必要です。";
        }
    }

    // エフェクトをリアルタイムに切り替える関数
    function updateEffect() {
        if (!audioCtx) return;

        // 一度すべての接続を解除
        microphone.disconnect();
        biquadFilter.disconnect();
        delayNode.disconnect();
        feedbackNode.disconnect();
        waveShaper.disconnect();

        const effect = voiceEffect.value;

        if (effect === 'high') {
            // 高い声：ハイパスフィルターで低音をカット
            biquadFilter.type = 'highpass';
            biquadFilter.frequency.setValueAtTime(1500, audioCtx.currentTime);
            microphone.connect(biquadFilter);
            biquadFilter.connect(audioCtx.destination);

        } else if (effect === 'low') {
            // 低い声：ローパスフィルターで高音をカットしてこもらせる
            biquadFilter.type = 'lowpass';
            biquadFilter.frequency.setValueAtTime(400, audioCtx.currentTime);
            microphone.connect(biquadFilter);
            biquadFilter.connect(audioCtx.destination);

        } else if (effect === 'robot') {
            // ロボット：短いディレイをループさせて金属音を作る
            microphone.connect(delayNode);
            delayNode.connect(feedbackNode);
            feedbackNode.connect(delayNode); // フィードバックループ
            
            delayNode.connect(audioCtx.destination);

        } else {
            // ノーマル：そのままスピーカーへ
            microphone.connect(audioCtx.destination);
        }
    }

    // イベントリスナー
    startBtn.addEventListener('click', setupAudio);
    
    voiceEffect.addEventListener('change', updateEffect);

    stopBtn.addEventListener('click', () => {
        if (localStream) {
            localStream.getTracks().forEach(track => track.stop());
        }
        if (audioCtx) {
            audioCtx.close();
        }
        statusText.innerText = "🔌 切断しました";
        startBtn.disabled = false;
        stopBtn.disabled = true;
    });
</script>

</body>
</html>
